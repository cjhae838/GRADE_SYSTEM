<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Choose Module</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .choice-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      padding: 40px 24px;
      max-width: 700px;
      margin: 0 auto;
    }

    .choice-card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--neo-outset);
      padding: 40px 24px;
      text-align: center;
      cursor: pointer;
      transition: var(--transition);
    }

    .choice-card:hover {
      box-shadow: var(--neo-outset-sm);
      transform: translateY(-2px);
    }

    .choice-card:active {
      box-shadow: var(--neo-inset);
      transform: translateY(0);
    }

    .choice-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      background: var(--primary-light);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .choice-icon svg {
      width: 32px;
      height: 32px;
      color: var(--primary);
    }

    .choice-card h3 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text);
    }

    .choice-card p {
      font-size: 0.85rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <!-- Logging Out Modal -->
  <div id="loggingOutModal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-icon">
        <div class="spinner"></div>
      </div>
      <h2>Logging out...</h2>
      <p class="modal-subtitle">Closing your session</p>
    </div>
  </div>

  <!-- Choice Screen -->
  <div class="admin-container">
    <header class="admin-header">
      <div class="admin-header-left">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        <div>
          <h1>Welcome <span id="accountBadge" class="account-badge"></span></h1>
          <p class="subtitle">What would you like to do?</p>
        </div>
      </div>
      <div class="admin-header-right">
        <button class="logout-btn" onclick="logout()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Logout
        </button>
      </div>
    </header>

    <div class="choice-grid">
      <div class="choice-card" onclick="window.location.href='admin-grades.html'">
        <div class="choice-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
            <polyline points="10 9 9 9 8 9"/>
          </svg>
        </div>
        <h3>Check Grades</h3>
        <p>View and manage student grade records</p>
      </div>

      <div class="choice-card" onclick="window.location.href='classroom/teacher-dashboard.html'">
        <div class="choice-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
          </svg>
        </div>
        <h3>Prepare Presentations</h3>
        <p>Manage and present student projects in class</p>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    const accountBadge = document.getElementById("accountBadge");
    const loggingOutModal = document.getElementById("loggingOutModal");
    const SESSION_TOKEN_KEY = "admin_session_token";

    // Auth check — redirect to login if no account
    const account = localStorage.getItem("admin_account");
    if (!account) {
      window.location.href = "admin-a7x9k2.html";
    } else {
      accountBadge.textContent = account;
    }

    async function logout() {
      loggingOutModal.classList.remove("hidden");
      const acct = localStorage.getItem("admin_account");
      if (acct) {
        try {
          await fetch(
            `${SUPABASE_URL}/rest/v1/admin_sessions?account_name=eq.${encodeURIComponent(acct)}`,
            {
              method: "DELETE",
              headers: {
                apikey: SUPABASE_ANON_KEY,
                Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
              },
            }
          );
          // End any active presentation sessions for this teacher
          await fetch(
            `${SUPABASE_URL}/rest/v1/sessions?teacher_id=eq.${encodeURIComponent(acct)}&status=eq.active`,
            {
              method: "PATCH",
              headers: {
                apikey: SUPABASE_ANON_KEY,
                Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
                "Content-Type": "application/json",
                "x-teacher": acct,
                "x-session-token": localStorage.getItem("admin_session_token"),
              },
              body: JSON.stringify({ status: "ended", ended_at: new Date().toISOString() }),
            }
          );
        } catch {}
      }
      localStorage.removeItem("admin_account");
      localStorage.removeItem(SESSION_TOKEN_KEY);
      window.location.href = "admin-a7x9k2.html";
    }
  </script>
</body>
</html>
