<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Grade Portal</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Password Modal -->
  <div id="passwordModal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <h2>Admin Access</h2>
      <p class="modal-subtitle">Enter the admin password to continue</p>
      <div class="modal-input-group">
        <input
          type="password"
          id="passwordInput"
          placeholder="Enter password"
          autocomplete="off"
        >
        <button id="loginBtn" onclick="attemptLogin()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
            <polyline points="10 17 15 12 10 7"/>
            <line x1="15" y1="12" x2="3" y2="12"/>
          </svg>
          Login
        </button>
      </div>
      <p id="passwordError" class="modal-error hidden"></p>
    </div>
  </div>

  <!-- Logging In Modal -->
  <div id="loggingInModal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-icon">
        <div class="spinner"></div>
      </div>
      <h2>Logging in...</h2>
      <p class="modal-subtitle">Verifying your credentials</p>
    </div>
  </div>

  <!-- Logging Out Modal -->
  <div id="loggingOutModal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-icon">
        <div class="spinner"></div>
      </div>
      <h2>Logging out...</h2>
      <p class="modal-subtitle">Closing your session</p>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="admin-auth.js"></script>
  <script src="admin-login.js"></script>
</body>
</html>
