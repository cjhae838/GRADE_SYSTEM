<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Dashboard - Presentations</title>
  <link rel="stylesheet" href="classroom.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <div class="page-container">

    <!-- Header -->
    <header class="page-header">
      <div class="page-header-left">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
          <line x1="8" y1="21" x2="16" y2="21"/>
          <line x1="12" y1="17" x2="12" y2="21"/>
        </svg>
        <div>
          <h1>Presentation Manager</h1>
          <p class="subtitle">Manage and present student projects</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn" onclick="window.location.href='../chooser.html'">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5"/>
            <polyline points="12 19 5 12 12 5"/>
          </svg>
          Back
        </button>
        <button class="btn btn-danger" onclick="logout()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Logout
        </button>
      </div>
    </header>

    <!-- Session Controls -->
    <div id="sessionSection">
      <button id="startSessionBtn" class="btn btn-primary" onclick="startSession()" style="margin-bottom: 24px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
        Start Presenting
      </button>

      <div id="activeSession" class="session-info hidden">
        <div class="session-label">Room Code</div>
        <div id="roomCode" class="room-code">------</div>
        <div class="session-label">Students Connected: <span id="studentCount">0</span></div>
        <button class="btn btn-danger" onclick="endSession()" style="margin-top: 20px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          </svg>
          End Presentation
        </button>
      </div>
    </div>

    <!-- My Presentations -->
    <div style="margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between;">
      <h2 style="font-size: 1rem; font-weight: 700;">My Presentations</h2>
      <button class="btn btn-primary btn-sm" onclick="openAddPresentation()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        Add Presentation
      </button>
    </div>

    <div id="presentationList" class="presentation-list">
      <!-- Placeholder content for Milestone 1 -->
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>
        <p>No presentations yet</p>
        <p class="hint">Click "Add Presentation" to upload your first project</p>
      </div>
    </div>

  </div>

  <script src="classroom.js"></script>
  <script>
    // Auth check
    if (!requireAuth()) throw new Error("Not authenticated");

    function openAddPresentation() {
      alert("Add presentation form — coming in Milestone 3");
    }

    function startSession() {
      alert("Session creation — coming in Milestone 7");
    }

    function endSession() {
      alert("End session — coming in Milestone 7");
    }
  </script>
</body>
</html>
