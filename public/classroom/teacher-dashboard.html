<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Dashboard - Presentations</title>
  <link rel="stylesheet" href="classroom.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <div class="page-container">

    <!-- Header -->
    <header class="page-header">
      <div class="page-header-left">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
          <line x1="8" y1="21" x2="16" y2="21"/>
          <line x1="12" y1="17" x2="12" y2="21"/>
        </svg>
        <div>
          <h1>Presentation Manager</h1>
          <p class="subtitle">Manage and present student projects</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn" onclick="window.location.href='../chooser.html'">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5"/>
            <polyline points="12 19 5 12 12 5"/>
          </svg>
          Back
        </button>
        <button class="logout-btn" onclick="logout()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Logout
        </button>
      </div>
    </header>

    <!-- Session Controls -->
    <div id="sessionSection">
      <button id="startSessionBtn" class="btn btn-primary" onclick="startSession()" style="margin-bottom: 24px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
        Start Presenting
      </button>

      <div id="activeSession" class="session-info hidden">
        <div class="session-label">Room Code</div>
        <div id="roomCode" class="room-code">------</div>
        <div class="session-label">Students Connected: <span id="studentCount">0</span></div>
        <button class="btn btn-danger" onclick="endSession()" style="margin-top: 20px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          </svg>
          End Presentation
        </button>
      </div>
    </div>

    <!-- My Presentations -->
    <div style="margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between;">
      <h2 style="font-size: 1rem; font-weight: 700;">My Presentations</h2>
      <button class="btn btn-primary btn-sm" onclick="openAddPresentationModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        Add Presentation
      </button>
    </div>

    <div id="presentationList" class="presentation-list">
      <div class="empty-state"><p>Loading…</p></div>
    </div>

  </div>

  <!-- Add Presentation Modal -->
  <div id="addPresentationModal" class="modal-overlay hidden">
    <div class="classroom-modal-card">
      <div class="add-modal-header">
        <h2>Add Presentation</h2>
        <button class="modal-close-btn" onclick="closeAddPresentationModal()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="classroom-field">
        <label for="presentationTitle">Title</label>
        <input id="presentationTitle" type="text" placeholder="e.g. Garbage Segregation Robot">
      </div>
      <div class="classroom-field">
        <label for="pdfFileInput">PDF document</label>
        <input id="pdfFileInput" type="file" accept=".pdf,application/pdf">
      </div>
      <div class="classroom-field">
        <label for="pythonFileInput">Python file</label>
        <input id="pythonFileInput" type="file" accept=".py,text/x-python">
      </div>
      <p id="addPresentationStatus" class="modal-error hidden"></p>
      <div class="confirm-modal-actions">
        <button id="addPresentationCancelBtn" class="confirm-cancel-btn">Cancel</button>
        <button id="addPresentationSaveBtn" class="btn btn-primary" onclick="savePresentation()">Upload</button>
      </div>
    </div>
  </div>

  <!-- Delete Presentation Modal -->
  <div id="deletePresentationModal" class="modal-overlay hidden">
    <div class="confirm-modal-card">
      <h3 class="confirm-modal-title">Delete Presentation</h3>
      <p id="deletePresentationMsg" class="confirm-modal-msg"></p>
      <div class="confirm-modal-actions">
        <button id="deletePresentationCancelBtn" class="confirm-cancel-btn">Cancel</button>
        <button id="deletePresentationConfirmBtn" class="confirm-delete-btn">Delete</button>
      </div>
    </div>
  </div>

  <script src="../config.js"></script>
  <script src="classroom.js"></script>
  <script src="teacher-dashboard.js"></script>
  <script>
    // Auth check
    if (!requireAuth()) throw new Error("Not authenticated");

    // Load and show presentations
    (function loadDashboard() {
      listPresentations()
        .then((rows) => { presentations = rows; renderList(); })
        .catch((err) => {
          console.error("Failed to load presentations:", err);
          document.getElementById("presentationList").innerHTML =
            '<div class="empty-state"><p>Could not load presentations</p><p class="hint">Check the Supabase connection and refresh.</p></div>';
        });
    })();

    document.getElementById("addPresentationCancelBtn").addEventListener("click", closeAddPresentationModal);
    document.getElementById("deletePresentationCancelBtn").addEventListener("click", closeDeletePresentationModal);
    document.getElementById("deletePresentationConfirmBtn").addEventListener("click", confirmDeletePresentation);

    function startSession() {
      alert("Session creation — coming in Milestone 7");
    }

    function endSession() {
      alert("End session — coming in Milestone 7");
    }
  </script>
</body>
</html>
