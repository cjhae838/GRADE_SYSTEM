<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join Presentation</title>
  <link rel="stylesheet" href="classroom.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <div class="join-container">
    <div class="join-card">

      <!-- Join form -->
      <div id="joinForm">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:48px;height:48px;color:var(--primary);margin-bottom:16px;">
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
          <line x1="8" y1="21" x2="16" y2="21"/>
          <line x1="12" y1="17" x2="12" y2="21"/>
        </svg>
        <h1>Classroom Presentation</h1>
        <p class="subtitle">Enter the room code to join</p>
        <input
          type="text"
          id="roomCodeInput"
          class="join-input"
          placeholder="Room code"
          maxlength="10"
          autocomplete="off"
          autofocus
        >
        <button class="join-btn" onclick="joinRoom()">Join</button>
        <p id="joinError" class="join-error hidden"></p>
      </div>

      <!-- Joined (polling for session end) -->
      <div id="joinedState" class="hidden">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:48px;height:48px;color:var(--success);margin-bottom:16px;">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
          <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
        <h1>Joined</h1>
        <p class="subtitle">You're in room <strong id="joinedRoomCode"></strong></p>
        <span class="status-badge status-active">Session active</span>
        <p class="session-hint" style="margin-top:16px;">Waiting for the teacher to start the presentation.</p>
        <button class="join-btn" onclick="leaveRoom()">Leave Room</button>
      </div>

      <!-- Ended (detected via polling) -->
      <div id="endedState" class="hidden">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:48px;height:48px;color:var(--text-secondary);margin-bottom:16px;">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
        </svg>
        <h1>Session Ended</h1>
        <p class="subtitle">The presentation has ended.</p>
        <button class="join-btn" onclick="backToJoin()">Join another room</button>
      </div>

    </div>
  </div>

  <script src="../config.js"></script>
  <script src="classroom.js"></script>
  <script>
    const roomCodeInput = document.getElementById("roomCodeInput");
    const joinError = document.getElementById("joinError");
    let pollTimer = null;
    let currentRoom = "";

    function showError(msg) {
      joinError.textContent = msg;
      joinError.classList.remove("hidden");
    }

    function hideError() {
      joinError.classList.add("hidden");
      joinError.textContent = "";
    }

    function showState(id) {
      ["joinForm", "joinedState", "endedState"].forEach((s) =>
        document.getElementById(s).classList.toggle("hidden", s !== id)
      );
    }

    async function joinRoom() {
      const code = roomCodeInput.value.trim().toUpperCase();
      if (!code) return showError("Please enter a room code.");
      hideError();
      const btn = document.querySelector("#joinForm .join-btn");
      btn.disabled = true;
      try {
        const session = await activeSessionByCode(code);
        if (!session) return showError("No active session found for that code.");
        currentRoom = code;
        document.getElementById("joinedRoomCode").textContent = code;
        showState("joinedState");
        clearInterval(pollTimer);
        pollTimer = setInterval(pollSession, 4000);
      } catch (err) {
        console.error("Join failed:", err);
        showError("Could not reach the server — try again.");
      } finally {
        btn.disabled = false;
      }
    }

    async function pollSession() {
      try {
        const session = await activeSessionByCode(currentRoom);
        if (!session) {
          clearInterval(pollTimer);
          pollTimer = null;
          currentRoom = "";
          showState("endedState");
        }
      } catch {
        // transient network error, keep polling
      }
    }

    function leaveRoom() {
      clearInterval(pollTimer);
      pollTimer = null;
      currentRoom = "";
      showState("joinForm");
    }

    function backToJoin() {
      roomCodeInput.value = "";
      showState("joinForm");
      roomCodeInput.focus();
    }

    roomCodeInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") joinRoom();
    });

    // Auto-uppercase input
    roomCodeInput.addEventListener("input", () => {
      roomCodeInput.value = roomCodeInput.value.toUpperCase();
    });
  </script>
</body>
</html>
