<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presentation Viewer</title>
  <link rel="stylesheet" href="classroom.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Teacher control bar -->
  <div id="teacherBar" class="control-bar hidden">
    <div class="control-room">
      <div class="session-label">Room Code</div>
      <div id="roomCode" class="room-code">------</div>
    </div>
    <div class="control-picker">
      <div class="session-label">Displaying</div>
      <select id="presentationPicker" onchange="switchPresentation(this.value)"></select>
      <p id="pickerHint" class="session-hint"></p>
    </div>
    <button id="endSessionBtn" class="btn btn-danger" onclick="endSession()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
      </svg>
      End Presentation
    </button>
  </div>

  <div class="page-container">

    <!-- Viewer Header -->
    <div class="viewer-header">
      <div class="viewer-title" id="viewerTitle">No presentation selected</div>
      <div id="viewerRoomCode" class="viewer-room-code"></div>
      <div class="viewer-actions">
        <button id="leaveRoomBtn" class="btn btn-ghost hidden" onclick="leaveRoom()">Leave Room</button>
        <div class="viewer-tabs">
          <button class="viewer-tab active" data-tab="docs" onclick="switchTab('docs', this)">
            Documentation
          </button>
          <button class="viewer-tab" data-tab="code" onclick="switchTab('code', this)">
            Code
          </button>
        </div>
      </div>
    </div>

    <!-- Documentation Panel -->
    <div id="panel-docs" class="viewer-content active">
      <div id="pdfLoading" class="empty-state hidden">
        <div class="spinner"></div>
        <p>Loading PDF…</p>
      </div>
      <div id="pdfViewer" class="pdf-viewer hidden">
        <div id="pdfContentArea" class="pdf-content-area">
          <!-- Multiple stacked canvases will be inserted here -->
        </div>
      </div>
<!-- Toolbar at BOTTOM, fixed, centered -->
      <div id="pdfToolbar" class="pdf-toolbar-fixed hidden">
        <div class="pdf-toolbar">
          <button class="btn btn-ghost pdf-btn" id="pdfZoomOutBtn" onclick="pdfZoomOut()" disabled title="Zoom out">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
              <line x1="8" y1="11" x2="14" y2="11"/>
            </svg>
          </button>
          <span id="pdfZoomLevel" class="pdf-zoom-level">100%</span>
          <button class="btn btn-ghost pdf-btn" id="pdfZoomInBtn" onclick="pdfZoomIn()" disabled title="Zoom in">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
              <line x1="11" y1="8" x2="11" y2="14"/>
              <line x1="8" y1="11" x2="14" y2="11"/>
            </svg>
          </button>
          <button class="btn btn-ghost pdf-btn" id="pdfFitWidthBtn" onclick="pdfFitWidth()" disabled title="Fit Width">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
              <line x1="3" y1="12" x2="21" y2="12"/>
              <line x1="12" y1="3" x2="12" y2="21"/>
            </svg>
          </button>
          <button class="btn btn-ghost pdf-btn" id="pdfFullscreenBtn" onclick="pdfToggleFullscreen()" disabled title="Fullscreen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
              <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
            </svg>
          </button>
        </div>
      </div>
      </div>
      <div id="pdfError" class="empty-state hidden">
        <p>Could not load PDF</p>
        <p class="hint">The file may be missing or corrupted.</p>
        <button class="btn btn-primary" onclick="retryPdf()">Retry</button>
      </div>
    </div>

    <!-- Code Panel -->
    <div id="panel-code" class="viewer-content">
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 18 22 12 16 6"/>
          <polyline points="8 6 2 12 8 18"/>
        </svg>
        <p>No code loaded</p>
        <p class="hint">Python source code will be displayed here</p>
      </div>
    </div>

  </div>

  <!-- Student: session ended overlay -->
  <div id="sessionEnded" class="join-container hidden" style="position: fixed; inset: 0; z-index: 2000;">
    <div class="join-card">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:48px;height:48px;color:var(--text-secondary);margin-bottom:16px;">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
      </svg>
      <h1>Session Ended</h1>
      <p class="subtitle">The presentation has ended.</p>
      <button class="join-btn" onclick="window.location.href='join.html'">Join another room</button>
    </div>
  </div>

  <script src="../config.js"></script>
  <script src="classroom.js"></script>
  <script src="presentation.js"></script>
</body>
</html>
