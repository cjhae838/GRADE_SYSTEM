<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presentation Viewer</title>
  <link rel="stylesheet" href="classroom.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <div class="page-container">

    <!-- Viewer Header -->
    <div class="viewer-header">
      <div class="viewer-title" id="viewerTitle">No presentation selected</div>
      <div class="viewer-tabs">
        <button class="viewer-tab active" onclick="switchTab('docs', this)">
          Documentation
        </button>
        <button class="viewer-tab" onclick="switchTab('code', this)">
          Code
        </button>
      </div>
    </div>

    <!-- Documentation Panel -->
    <div id="panel-docs" class="viewer-content active">
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>
        <p>No documentation loaded</p>
        <p class="hint">PDF viewer will display project documentation here</p>
      </div>
    </div>

    <!-- Code Panel -->
    <div id="panel-code" class="viewer-content">
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 18 22 12 16 6"/>
          <polyline points="8 6 2 12 8 18"/>
        </svg>
        <p>No code loaded</p>
        <p class="hint">Python source code will be displayed here</p>
      </div>
    </div>

  </div>

  <script>
    function switchTab(tab, btn) {
      document.querySelectorAll(".viewer-tab").forEach(t => t.classList.remove("active"));
      document.querySelectorAll(".viewer-content").forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("panel-" + tab).classList.add("active");
    }
  </script>
</body>
</html>
